plugins {
    id 'java'
    id 'application'
    id 'com.github.hierynomus.license' version '0.16.1'
}

group = 'com.pankajpandey'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.1'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'com.mysql:mysql-connector-j:9.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'com.h2database:h2:2.3.232'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.pankajpandey.regression.App'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

license {
    header rootProject.file('HEADER')
    strictCheck true
    includes(['**/*.java', '**/*.gradle'])
    mapping {
        java = 'SLASHSTAR_STYLE'
        gradle = 'SLASHSTAR_STYLE'
    }
}

test {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('license')
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles a runnable jar with dependencies.'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

assemble.dependsOn(tasks.named('fatJar'))
